<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student DBMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Student Database Management System</h1>
        </header>

        <!-- Search Bar -->
        <div class="search-bar">
            <form th:action="@{/students}" method="get" class="search-form">
                <input type="text" name="keyword" th:value="${keyword}"
                       placeholder="Search by name..." class="search-input">
                <button type="submit" class="btn btn-primary">🔍 Search</button>
                <a th:href="@{/students}" class="btn btn-secondary">Clear</a>
            </form>
            <a th:href="@{/students/add}" class="btn btn-success">➕ Add New Student</a>
        </div>

        <!-- Students Table -->
        <div class="table-wrapper">
            <table th:if="${!students.isEmpty()}">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student, iterStat : ${students}">
                        <td th:text="${iterStat.count}">1</td>
                        <td th:text="${student.firstName}">John</td>
                        <td th:text="${student.lastName}">Doe</td>
                        <td th:text="${student.email}">john@email.com</td>
                        <td th:text="${student.course}">CSE</td>
                        <td th:text="${student.year}">1</td>
                        <td class="actions">
                            <a th:href="@{/students/edit/{id}(id=${student.id})}"
                               class="btn btn-primary btn-sm">✏️ Edit</a>
                            <a th:href="@{/students/delete/{id}(id=${student.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this student?')">
                                🗑️ Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- No students message -->
            <div th:if="${students.isEmpty()}" class="no-data">
                <p>📭 No students found. Click "Add New Student" to get started!</p>
            </div>
        </div>
    </div>
</body>
</html>
