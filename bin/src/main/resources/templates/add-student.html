<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>➕ Add New Student</h1>
        </header>

        <div class="form-card">
            <form th:action="@{/students/save}" th:object="${student}" method="post">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}"
                           placeholder="Enter first name" class="form-input">
                    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"
                          class="error"></span>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}"
                           placeholder="Enter last name" class="form-input">
                    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"
                          class="error"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}"
                           placeholder="Enter email address" class="form-input">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                          class="error"></span>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input type="text" id="course" th:field="*{course}"
                           placeholder="e.g. CSE, ECE, MECH" class="form-input">
                    <span th:if="${#fields.hasErrors('course')}" th:errors="*{course}"
                          class="error"></span>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" th:field="*{year}"
                           min="1" max="4" placeholder="1-4" class="form-input">
                    <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}"
                          class="error"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success">💾 Save Student</button>
                    <a th:href="@{/students}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
